          description: ''
  /api/appsettings/snapshot/{snapshot_id}/:
    get:
      operationId: appsettings_snapshot_retrieve_2
      description: handle get request
      parameters:
      - in: path
        name: snapshot_id
        schema:
          type: string
        required: true
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotItem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: snapshot not found
    post:
      operationId: appsettings_snapshot_create_2
      description: restore snapshot
      parameters:
      - in: path
        name: snapshot_id
        schema:
          type: string
        required: true
      tags:
