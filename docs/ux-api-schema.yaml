  /api/channel/search/:
    get:
      operationId: channel_search_retrieve
      description: search for local channel ID
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search query string
        required: true
      tags:
      - channel
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
