        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Channel not found
  /api/download/:
    get:
      operationId: download_retrieve
      description: get download queue list
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          minLength: 1
        description: channel ID
      - in: query
        name: error
        schema:
          type: boolean
          nullable: true
      - in: query
        name: filter
        schema:
          enum:
          - pending
          - ignore
          type: string
          minLength: 1
        description: |-
          * `pending` - pending
          * `ignore` - ignore
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
        description: Search Query
      - in: query
        name: vid_type
        schema:
          enum:
          - videos
          - streams
          - shorts
          type: string
          minLength: 1
        description: |-
          * `videos` - videos
          * `streams` - streams
          * `shorts` - shorts
      tags:
      - download
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
          description: ''
    post:
      operationId: download_create
      description: add list of videos to download queue
      parameters:
      - in: query
        name: autostart
        schema:
          type: boolean
      - in: query
        name: flat
        schema:
          type: boolean
      - in: query
        name: force
        schema:
          type: boolean
      tags:
      - download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToDownloadList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToDownloadList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToDownloadList'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskResponse'
          description: New async task started
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
    patch:
      operationId: download_partial_update
      description: bulk update status
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          minLength: 1
      - in: query
        name: error
        schema:
          type: boolean
          nullable: true
      - in: query
        name: filter
        schema:
          enum:
          - pending
          - ignore
          - priority
          type: string
          minLength: 1
        description: |-
          * `pending` - pending
          * `ignore` - ignore
          * `priority` - priority
        required: true
      - in: query
        name: vid_type
        schema:
          enum:
          - videos
          - streams
          - shorts
          type: string
          minLength: 1
        description: |-
          * `videos` - videos
          * `streams` - streams
          * `shorts` - shorts
      tags:
      - download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBulkUpdateDowloadData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBulkUpdateDowloadData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBulkUpdateDowloadData'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Status updated
    delete:
      operationId: download_destroy
      description: bulk delete download queue items by filter
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          minLength: 1
        description: channel ID
      - in: query
        name: filter
        schema:
          enum:
          - pending
          - ignore
          type: string
          minLength: 1
        description: |-
          * `pending` - pending
          * `ignore` - ignore
        required: true
      - in: query
        name: vid_type
        schema:
          enum:
          - videos
          - streams
          - shorts
          type: string
          minLength: 1
        description: |-
          * `videos` - videos
          * `streams` - streams
          * `shorts` - shorts
      tags:
      - download
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Download items deleted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
  /api/download/{video_id}/:
    get:
      operationId: download_retrieve_2
      description: get download queue item
      parameters:
      - in: path
        name: video_id
        schema:
          type: string
        required: true
      tags:
      - download
      security:
      - cookieAuth: []
      - tokenAuth: []
