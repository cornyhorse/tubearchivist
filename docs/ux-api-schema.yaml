      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
    delete:
      operationId: appsettings_token_destroy
      description: delete your API token, new will get created on next get
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: delete token
  /api/channel/:
    get:
      operationId: channel_retrieve
      description: get request
      parameters:
      - in: query
        name: filter
        schema:
          enum:
          - subscribed
          - unsubscribed
          type: string
          minLength: 1
        description: |-
          * `subscribed` - subscribed
          * `unsubscribed` - unsubscribed
      - in: query
        name: page
        schema:
          type: integer
      tags:
      - channel
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
          description: ''
    post:
      operationId: channel_create
      description: subscribe/unsubscribe to list of channels
      tags:
      - channel
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/channel/{channel_id}/:
    get:
      operationId: channel_retrieve_2
      description: get channel detail
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
        required: true
      tags:
      - channel
      security:
      - cookieAuth: []
      - tokenAuth: []
