openapi: 3.0.3
info:
  title: Tube Archivist API
  version: v0.5.12
  description: API documentation for Tube Archivist backend.
paths:
  /api/add/:
    post:
      operationId: add_create
      description: queue one high priority scan job per link
      tags:
      - add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Add'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Add'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Add'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: bad request
  /api/add/preview/:
    post:
      operationId: add_preview_create
      description: |-
        preview links; reads YouTube (flat), so it can take a few seconds
        per channel; results are cached for 10 minutes per link
      tags:
      - add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewQuery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreviewQuery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreviewQuery'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: bad request
  /api/appsettings/backup/:
    get:
      operationId: appsettings_backup_retrieve
      description: get list of available backup files
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupFile'
          description: ''
    post:
      operationId: appsettings_backup_create
      description: start new backup file task
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskResponse'
          description: ''
  /api/appsettings/backup/{filename}/:
    get:
      operationId: appsettings_backup_retrieve_2
      description: get single backup
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupFile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: file not found
    post:
      operationId: appsettings_backup_create_2
      description: start new task to restore backup file
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: file not found
    delete:
      operationId: appsettings_backup_destroy
      description: delete backup file
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: file deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: file not found
