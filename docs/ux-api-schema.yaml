    post:
      operationId: channel_create_2
      description: modify channel
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
        required: true
      tags:
      - channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelUpdate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
