      - title
      - vid_last_refresh
      - vid_thumb_url
      - vid_type
      - youtube_id
    VideoList:
      type: object
      description: serialize video list
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        paginate:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - paginate
    VideoNumber:
      type: object
      description: a video's number in one series
      properties:
        series_kind:
          $ref: '#/components/schemas/SeriesKindEnum'
        series_id:
          type: string
        series_title:
          type: string
          readOnly: true
        scheme:
          allOf:
          - $ref: '#/components/schemas/NumberingSchemeEnum'
          readOnly: true
        season:
          type: integer
          minimum: 0
        episode:
          type: integer
          minimum: 0
        name:
          type: string
          readOnly: true
        manual:
          type: boolean
          readOnly: true
      required:
      - episode
      - manual
      - name
      - scheme
      - season
      - series_id
      - series_kind
      - series_title
    VideoNumberList:
      type: object
      description: 'GET /api/numbering/video/<youtube_id>/: every series it is in'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoNumber'
      required:
      - data
    VideoOverride:
      type: object
      description: per-video 'download anyway' or 'always ignore'
      properties:
        youtube_id:
          type: string
          readOnly: true
        override:
          $ref: '#/components/schemas/VideoOverrideEnum'
        note:
          type: string
          default: ''
        title:
          type: string
          readOnly: true
          nullable: true
        channel_id:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel_id
      - created_at
      - override
      - title
      - youtube_id
    VideoOverrideEnum:
      enum:
      - download
      - ignore
      type: string
      description: |-
        * `download` - download
        * `ignore` - ignore
    VideoOverrideList:
      type: object
      description: GET /api/rules/videos/
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoOverride'
      required:
      - data
    VideoProgressUpdate:
      type: object
      description: serialize progress update data
      properties:
        position:
          type: number
          format: double
          default: 0.0
    VideoStats:
      type: object
      description: serialize video stats
      properties:
        doc_count:
          type: integer
        media_size:
          type: integer
        duration:
          type: integer
        duration_str:
          type: string
        type_videos:
          allOf:
          - $ref: '#/components/schemas/VideoStatsItem'
          nullable: true
        type_shorts:
          allOf:
          - $ref: '#/components/schemas/VideoStatsItem'
          nullable: true
        type_streams:
          allOf:
          - $ref: '#/components/schemas/VideoStatsItem'
          nullable: true
        active_true:
          allOf:
          - $ref: '#/components/schemas/VideoStatsItem'
          nullable: true
        active_false:
          allOf:
          - $ref: '#/components/schemas/VideoStatsItem'
          nullable: true
      required:
      - active_false
      - active_true
      - doc_count
      - duration
      - duration_str
      - media_size
      - type_shorts
      - type_streams
      - type_videos
    VideoStatsItem:
      type: object
      description: serialize video stats item
      properties:
        doc_count:
          type: integer
        media_size:
          type: integer
        duration:
          type: integer
        duration_str:
          type: string
      required:
      - doc_count
      - duration
      - duration_str
      - media_size
    ViewStyleHomeEnum:
      enum:
      - grid
      - list
      - table
      type: string
      description: |-
        * `grid` - grid
        * `list` - list
        * `table` - table
    ViewStylePlaylistEnum:
      enum:
      - grid
      - list
      type: string
      description: |-
        * `grid` - grid
        * `list` - list
    WatchItemStats:
      type: object
      description: serialize watch item stats
      properties:
        duration:
          type: integer
        duration_str:
          type: string
        progress:
          type: number
          format: double
        items:
          type: integer
      required:
      - duration
      - duration_str
      - items
      - progress
    WatchStats:
      type: object
      description: serialize watch stats
      properties:
        total:
          allOf:
          - $ref: '#/components/schemas/WatchTotalStats'
          nullable: true
        unwatched:
          allOf:
          - $ref: '#/components/schemas/WatchItemStats'
          nullable: true
        watched:
          allOf:
          - $ref: '#/components/schemas/WatchItemStats'
          nullable: true
      required:
      - total
      - unwatched
      - watched
    WatchTotalStats:
      type: object
      description: serialize total watch stats
      properties:
        duration:
          type: integer
        duration_str:
          type: string
        items:
          type: integer
      required:
      - duration
      - duration_str
      - items
    WatchedData:
      type: object
      description: mark as watched serializer
      properties:
        id:
          type: string
        is_watched:
          type: boolean
      required:
      - id
      - is_watched
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
