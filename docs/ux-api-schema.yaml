      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
        required: true
      tags:
      - channel
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Channel deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Channel not found
