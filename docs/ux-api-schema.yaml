        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Download item not found
    post:
      operationId: download_create_2
      description: post to video to change status
      parameters:
      - in: path
        name: video_id
        schema:
          type: string
        required: true
      tags:
      - download
      requestBody:
        content:
          application/json:
            schema:
