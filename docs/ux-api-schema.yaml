      type: object
      description: |-
        GET/PUT /api/mediaserver/
        api_key is write-only: omit it to keep the stored key, null or "" to
        clear it; when TA_MEDIASERVER_API_KEY is set, the env var wins and
        api_key_source is 'env'
      properties:
        type:
          nullable: true
          description: |-
            null: disabled

            * `emby` - emby
            * `jellyfin` - jellyfin
          oneOf:
          - $ref: '#/components/schemas/MediaServerTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        url:
          description: e.g. http://192.0.2.10:8096
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        api_key:
          type: string
          writeOnly: true
          nullable: true
        api_key_set:
          type: boolean
          readOnly: true
        api_key_source:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ApiKeySourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        library_id:
          type: string
          description: library to refresh on full refresh
        path_from:
          type: string
          readOnly: true
          description: TA's Emby root, TA_EMBY_ROOT
        path_to:
          type: string
          description: the same folder as the media server sees it
        notify_enabled:
          type: boolean
        debounce_seconds:
          type: integer
          maximum: 3600
          minimum: 0
        last_notify:
          allOf:
          - $ref: '#/components/schemas/LastNotify'
          readOnly: true
          nullable: true
