      tags:
      - appsettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CookieUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CookieUpdate'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieValidation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
    delete:
      operationId: appsettings_cookie_destroy
      description: delete the cookie
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Cookie revoked
  /api/appsettings/manual-import/:
    post:
      operationId: appsettings_manual_import_create
      description: manual import
