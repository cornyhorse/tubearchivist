          * `thumbnail_check` - thumbnail_check
          * `resync_metadata` - resync_metadata
          * `manual_import` - manual_import
          * `index_playlists` - index_playlists
          * `subscribe` - subscribe
          * `version_check` - version_check
          * `snapshot` - snapshot
