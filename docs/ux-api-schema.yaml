components:
  schemas:
    Account:
      type: object
      description: serialize account
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_staff:
          type: boolean
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - name
    Add:
      type: object
      description: POST /api/add/
      properties:
        urls:
          type: string
          description: video, channel or playlist links or ids
        mode:
          $ref: '#/components/schemas/AddModeEnum'
        newest_n:
          type: integer
          minimum: 1
          description: required for newest_n
        rule:
          allOf:
          - $ref: '#/components/schemas/DownloadRule'
          nullable: true
          description: rule for these items; omit to keep the effective rule
        save_rule:
          type: boolean
          description: store the rule on the channel or playlist; default true for
            subscribe, false otherwise (then it applies to this add only)
        numbering:
          $ref: '#/components/schemas/NumberingSchemeEnum'
        download_now:
          type: boolean
          default: true
          description: queue downloads for allowed videos as they're found
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: high
      required:
      - mode
      - urls
    AddDownloadItem:
      type: object
      description: serialize single item to add
      properties:
        youtube_id:
          type: string
        status:
          $ref: '#/components/schemas/AddDownloadItemStatusEnum'
      required:
      - status
      - youtube_id
    AddDownloadItemStatusEnum:
      enum:
      - pending
      - ignore-force
      type: string
      description: |-
        * `pending` - pending
        * `ignore-force` - ignore-force
    AddModeEnum:
      enum:
      - subscribe
      - once
      - newest_n
      type: string
      description: |-
        * `subscribe` - subscribe
        * `once` - once
        * `newest_n` - newest_n
    AddResult:
      type: object
      description: 'POST /api/add/ response: one scan job per resolved link'
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UrlError'
      required:
      - errors
      - jobs
    AddToDownloadList:
      type: object
      description: serialize add to download queue data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AddDownloadItem'
      required:
      - data
    ApiKeySourceEnum:
      enum:
      - env
      - db
      type: string
      description: |-
        * `env` - env
        * `db` - db
    AppConfig:
      type: object
      description: serialize appconfig
      properties:
        subscriptions:
          $ref: '#/components/schemas/AppConfigSub'
        downloads:
          $ref: '#/components/schemas/AppConfigDownloads'
        application:
          $ref: '#/components/schemas/AppConfigApp'
    AppConfigApp:
      type: object
      description: serialize app config
      properties:
        enable_snapshot:
          type: boolean
        enable_cast:
          type: boolean
      required:
      - enable_cast
      - enable_snapshot
    AppConfigDownloads:
      type: object
      description: serialize app config downloads config
      properties:
        limit_speed:
          type: integer
          nullable: true
        sleep_interval:
          type: integer
          nullable: true
        autodelete_days:
          type: integer
          nullable: true
        format:
          type: string
          nullable: true
        format_sort:
          type: string
          nullable: true
        add_metadata:
          type: boolean
        subtitle:
          type: string
          nullable: true
        subtitle_source:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SubtitleSourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        subtitle_index:
          type: boolean
        comment_max:
          type: string
          nullable: true
        comment_sort:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CommentSortEnum'
          - $ref: '#/components/schemas/NullEnum'
        cookie_import:
          type: boolean
        pot_provider_url:
          type: string
          nullable: true
        throttledratelimit:
          type: integer
          nullable: true
        extractor_lang:
          type: string
          nullable: true
        integrate_ryd:
          type: boolean
        integrate_sponsorblock:
          type: boolean
      required:
      - add_metadata
      - autodelete_days
      - comment_max
      - comment_sort
      - cookie_import
      - extractor_lang
      - format
      - format_sort
      - integrate_ryd
      - integrate_sponsorblock
      - limit_speed
      - pot_provider_url
      - sleep_interval
      - subtitle
      - subtitle_index
      - subtitle_source
      - throttledratelimit
    AppConfigSub:
      type: object
      description: serialize app config subscriptions
      properties:
        channel_size:
          type: integer
          nullable: true
        live_channel_size:
          type: integer
          nullable: true
        shorts_channel_size:
          type: integer
          nullable: true
        playlist_size:
          type: integer
          nullable: true
        auto_start:
          type: boolean
        extract_flat:
          type: boolean
    AsyncTaskResponse:
      type: object
      description: serialize new async task
      properties:
        message:
          type: string
        task_id:
          type: string
        status:
          type: string
        filename:
          type: string
      required:
      - task_id
    BackupFile:
      type: object
      description: serialize backup file
      properties:
        filename:
          type: string
        file_path:
          type: string
        file_size:
          type: integer
        timestamp:
          type: string
        reason:
          type: string
      required:
      - file_path
      - file_size
      - filename
      - reason
      - timestamp
    BiggestChannelItem:
      type: object
      description: serialize biggest channel item
      properties:
        id:
          type: string
        name:
          type: string
        doc_count:
          type: integer
        duration:
          type: integer
        duration_str:
          type: string
        media_size:
          type: integer
      required:
      - doc_count
      - duration
      - duration_str
      - id
      - media_size
      - name
    BulkUpdateDowloadDataStatusEnum:
      enum:
      - pending
      - ignore
      - priority
      - clear_error
      type: string
      description: |-
        * `pending` - pending
        * `ignore` - ignore
        * `priority` - priority
        * `clear_error` - clear_error
    Channel:
      type: object
      description: serialize channel
      properties:
        channel_id:
          type: string
        channel_active:
          type: boolean
        channel_banner_url:
          type: string
          nullable: true
        channel_thumb_url:
          type: string
          nullable: true
        channel_tvart_url:
          type: string
          nullable: true
        channel_description:
          type: string
          nullable: true
        channel_last_refresh:
          type: string
        channel_name:
          type: string
        channel_overwrites:
          $ref: '#/components/schemas/ChannelOverwrite'
        channel_subs:
          type: integer
        channel_subscribed:
          type: boolean
        channel_tags:
          type: array
          items:
            type: string
        channel_tabs:
          type: array
          items:
            $ref: '#/components/schemas/ChannelTabsEnum'
        emby_numbering:
          $ref: '#/components/schemas/EmbyNumbering4c7Enum'
        download_rule:
          allOf:
          - $ref: '#/components/schemas/DownloadRule'
          nullable: true
        _index:
          type: string
          title: ' index'
        _score:
          type: integer
          title: ' score'
      required:
      - channel_active
      - channel_id
      - channel_last_refresh
      - channel_name
      - channel_subs
      - channel_subscribed
      - channel_tabs
    ChannelAgg:
      type: object
      description: serialize channel aggregation
      properties:
        total_items:
          $ref: '#/components/schemas/ChannelAggBucket'
        total_size:
          $ref: '#/components/schemas/ChannelAggBucket'
        total_duration:
          $ref: '#/components/schemas/ChannelAggBucket'
      required:
      - total_duration
      - total_items
      - total_size
    ChannelAggBucket:
      type: object
      description: serialize channel agg bucket
      properties:
        value:
          type: integer
        value_str:
          type: string
      required:
      - value
    ChannelList:
      type: object
      description: serialize channel list
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        paginate:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - paginate
    ChannelNav:
      type: object
      description: serialize channel navigation
      properties:
        has_pending:
          type: boolean
        has_ignored:
          type: boolean
        has_playlists:
          type: boolean
        has_videos:
          type: boolean
        has_streams:
          type: boolean
        has_shorts:
          type: boolean
      required:
      - has_ignored
      - has_pending
      - has_playlists
      - has_shorts
      - has_streams
      - has_videos
    ChannelOverwrite:
      type: object
      description: serialize channel overwrites
      properties:
        download_format:
          type: string
          nullable: true
        autodelete_days:
          type: integer
          nullable: true
        index_playlists:
          type: boolean
          nullable: true
        integrate_sponsorblock:
          type: boolean
          nullable: true
        subscriptions_channel_size:
          type: integer
          nullable: true
        subscriptions_live_channel_size:
          type: integer
          nullable: true
        subscriptions_shorts_channel_size:
          type: integer
          nullable: true
    ChannelStats:
      type: object
      description: serialize channel stats
      properties:
        doc_count:
          type: integer
          nullable: true
        active_true:
