          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DownloadQueueItemUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DownloadQueueItemUpdate'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadQueueItemUpdate'
          description: Download item update
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Download item not found
    delete:
      operationId: download_destroy_2
      description: delete single video from queue
      parameters:
      - in: path
        name: video_id
        schema:
          type: string
        required: true
      tags:
      - download
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: delete download item
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Download item not found
  /api/download/aggs/:
    get:
      operationId: download_aggs_retrieve
      description: get aggs
      parameters:
      - in: query
        name: channel
        schema:
