      description: post request
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/appsettings/membership/token/:
    get:
      operationId: appsettings_membership_token_retrieve
