    post:
      operationId: appsettings_membership_token_create
      description: add token
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: appsettings_membership_token_destroy
      description: delete token
      tags:
      - appsettings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/appsettings/rescan-filesystem/:
    post:
      operationId: appsettings_rescan_filesystem_create
      description: start new task rescan filesystem task
      tags:
