services:
  tubearchivist:
    container_name: tubearchivist
    restart: unless-stopped
    image: ghcr.io/cornyhorse/tubearchivist
    ports:
      - 8000:8000
    volumes:
      - media:/youtube
      - cache:/cache
    environment:
      - TA_DB_HOST=archivist-postgres
      - TA_DB_PASSWORD=verysecret            # match POSTGRES_PASSWORD below
      - REDIS_CON=redis://archivist-redis:6379
      - HOST_UID=1000
      - HOST_GID=1000
      - TA_HOST=http://tubearchivist.local:8000  # set your host name with protocol and port
      - TA_USERNAME=tubearchivist           # your initial TA credentials
      - TA_PASSWORD=verysecret              # your initial TA credentials
      - TZ=America/New_York                 # set your time zone
      # native Emby library: a dot folder inside the media mount, because
      # media is hardlinked (and hardlinks can't cross mounts)
      # - TA_EMBY_ROOT=/youtube/.emby
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-postgres
      - archivist-redis
  archivist-redis:
    image: redis
    container_name: archivist-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis:/data
  archivist-postgres:
    image: postgres:17-alpine
    container_name: archivist-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tubearchivist
      - POSTGRES_PASSWORD=verysecret
      - POSTGRES_DB=tubearchivist
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  media:
  cache:
  redis:
  postgres:
