name: fork_image

# Builds the Cornyhorse fork image and publishes it to ghcr.io (public, so the
# GPL-3.0 source requirement is met by this repository). Only runs on a
# fork-v* tag or by hand, never on ordinary pushes. A manual run only
# publishes from main or a fork-v* tag, never from another branch.
on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/fork-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/cornyhorse/tubearchivist
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
