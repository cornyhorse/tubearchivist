name: python_unit_tests

on:
  push:
    paths:
      - '**/*.py'
  pull_request:
    paths:
      - '**/*.py'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ta
          POSTGRES_PASSWORD: ta-ci-only
          POSTGRES_DB: ta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ta"
          --health-interval 2s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      TA_DB_HOST: 127.0.0.1
      TA_DB_PORT: 5432
      TA_DB_NAME: ta
      TA_DB_USER: ta
      TA_DB_PASSWORD: ta-ci-only
      REDIS_CON: redis://127.0.0.1:6379
      TA_PASSWORD: ci-only
      TZ: UTC

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libldap2-dev libsasl2-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        # 100% coverage of fork-owned code, see .coveragerc
        run: pytest backend --cov --cov-config=.coveragerc
