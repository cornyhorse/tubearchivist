<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply the cached theme before any stylesheet loads, so the page never
      // flashes the wrong theme; the user's saved setting re-syncs it after login
      (function () {
        var themes = ['light', 'dark', 'paper', 'contrast', 'colourblind'];
        var schemes = {
          light: 'light',
          dark: 'dark',
          paper: 'light',
          contrast: 'dark',
          colourblind: 'light',
        };
        var theme = null;
        try {
          theme = localStorage.getItem('ta-theme');
        } catch (e) {}
        if (themes.indexOf(theme) !== -1) {
          document.documentElement.setAttribute('data-theme', theme);
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute('content', schemes[theme]);
        }
      })();
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#01202e" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />

    <meta name="apple-mobile-web-app-title" content="TubeArchivist" />
    <meta name="application-name" content="TubeArchivist" />
    <meta name="msapplication-TileColor" content="#01202e" />
    <meta name="msapplication-config" content="/favicon/browserconfig.xml" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TubeArchivist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
